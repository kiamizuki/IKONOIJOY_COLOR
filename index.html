    function createShapeSvg(id, colors, group, isPinned = false, sizeClass = "w-10 h-10") {
      let gradStr = '';
      const prefix = isPinned ? 'pin-' : '';
      if (colors.length === 1) {
        gradStr = `<stop offset="0%" stop-color="${colors[0]}" /><stop offset="100%" stop-color="${colors[0]}" />`;
      } else if (colors.length === 2) {
        gradStr = `<stop offset="0%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[1]}" /><stop offset="100%" stop-color="${colors[1]}" />`;
      } else {
        gradStr = `<stop offset="0%" stop-color="${colors[0]}" /><stop offset="50%" stop-color="${colors[1]}" /><stop offset="100%" stop-color="${colors[2]}" />`;
      }

      const isWhite = colors.every(c => c.toUpperCase() === '#FFFFFF');
      const strokeColor = isWhite ? '#64748b' : '#cbd5e1';
      const glowVar = colors[0] === '#FFFFFF' ? '#94a3b8' : colors[0];
      const gradId = `${prefix}color-grad-${id}-${sizeClass.replace(/\s+/g, '')}`;

      let shapePath = '';
      if (group === 'not-equal-me') {
        shapePath = `
          <polygon points="8,5 24,5 30,13 16,29 2,13" fill="url(#${gradId})" stroke="${strokeColor}" stroke-width="1.5" stroke-linejoin="round" />
          <polyline points="2,13 30,13" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1" />
          <polyline points="8,5 12,13 16,29 20,13 24,5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1" />
        `;
      } else if (group === 'nearly-equal-joy') {
        shapePath = `
          <path d="M4,24 L3,10 L10,16 L16,6 L22,16 L29,10 L28,24 Z" fill="url(#${gradId})" stroke="${strokeColor}" stroke-width="1.5" stroke-linejoin="round" />
          <rect x="4" y="25" width="24" height="3.5" rx="1.5" fill="url(#${gradId})" stroke="${strokeColor}" stroke-width="1.2" />
          <circle cx="16" cy="4.5" r="1.8" fill="url(#${gradId})" stroke="${strokeColor}" stroke-width="1" />
        `;
      } else {
        shapePath = `<path d="M16,28.5 C16,28.5 3,20 3,11.5 C3,5.5 7,2.5 11.5,2.5 C14.5,2.5 16,4.5 16,4.5 C16,4.5 17.5,2.5 20.5,2.5 C25,2.5 29,5.5 29,11.5 C29,20 16,28.5 16,28.5 Z" fill="url(#${gradId})" stroke="${strokeColor}" stroke-width="1.5" />`;
      }

      return `
        <svg viewBox="0 0 32 32" aria-hidden="true" class="${sizeClass} transition-transform duration-300 glow-effect" style="--glow-color: ${glowVar}">
          <defs><linearGradient id="${gradId}" x1="0%" y1="100%" x2="100%" y2="0%">${gradStr}</linearGradient></defs>
          ${shapePath}
        </svg>
      `;
    }

    function createSinglePenlightSvg(color, id, index, total, isPinned = false, sizeClass = "w-8 h-10") {
      const prefix = isPinned ? 'pin-' : '';
      const gradId = `${prefix}pen-grad-${id}-${index}-${sizeClass.replace(/\s+/g, '')}`;
      const isWhite = color.toUpperCase() === '#FFFFFF';
      
      let gradHtml = isWhite ? `
        <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#CBD5E1" /><stop offset="50%" stop-color="#FFFFFF" /><stop offset="100%" stop-color="#94A3B8" />
        </linearGradient>
      ` : `
        <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="${color}" /><stop offset="35%" stop-color="#FFFFFF" /><stop offset="70%" stop-color="${color}" /><stop offset="100%" stop-color="${color}" />
        </linearGradient>
      `;

      const strokeColor = isWhite ? '#64748b' : '#cbd5e1';
      let transformStyle = '';
      let marginStyle = '';
      if (total > 1) {
        const angle = -14 + (index * (28 / (total - 1)));
        const tx = -3 + (index * 3);
        transformStyle = `transform: rotate(${angle}deg) translateX(${tx}px);`;
        marginStyle = index > 0 ? 'margin-left: -14px;' : '';
      }

      const glowColor = color === '#FFFFFF' ? '#94a3b8' : color;

      return `
        <svg viewBox="0 0 40 52" aria-hidden="true" class="${sizeClass} transition-all duration-300 glow-effect" style="--glow-color: ${glowColor}; ${transformStyle} ${marginStyle} z-index: ${index + 1}; position: relative;">
          <defs>${gradHtml}</defs>
          <path d="M18,34 L22,34 L23,47 A3,3 0 0,1 17,47 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.2"/>
          <rect x="18" y="36" width="4" height="2" rx="0.5" fill="#64748b"/>
          <rect x="13" y="6" width="14" height="27" rx="7" fill="url(#${gradId})" stroke="${strokeColor}" stroke-width="1.2" />
          <rect x="12" y="32" width="16" height="2.5" fill="#94a3b8" rx="0.5"/>
        </svg>
      `;
    }

    function createPenlightsHtml(pColors, id, isPinned = false, sizeClass = "w-8 h-10") {
      let html = '<div class="flex items-center justify-center relative">';
      pColors.forEach((color, index) => {
        html += createSinglePenlightSvg(color, id, index, pColors.length, isPinned, sizeClass);
      });
      html += '</div>';
      return html;
    }

    function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      const member = members.find(m => m.id === id);
      const memberName = member ? member.name : 'メンバー';
      const index = state.favorites.indexOf(id);
      if (index > -1) {
        state.favorites.splice(index, 1);
        showToast(`${memberName}をお気に入りから解除しました`, "☆");
      } else {
        state.favorites.push(id);
        showToast(`${memberName}をお気に入りに登録しました！`, "💖");
      }
      localStorage.setItem('ikj_favorites', JSON.stringify(state.favorites));
      renderGrid();
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        state.theme = 'light';
        document.getElementById('themeIconMobile').innerText = '🌙';
        document.getElementById('themeIconPC').innerText = '🌙';
        announceToScreenReader('ライトモードに切り替えました');
      } else {
        html.classList.add('dark');
        state.theme = 'dark';
        document.getElementById('themeIconMobile').innerText = '☀️';
        document.getElementById('themeIconPC').innerText = '☀️';
        announceToScreenReader('ダークモードに切り替えました');
      }
      localStorage.setItem('ikj_theme', state.theme);
    }

    function loadTheme() {
      if (state.theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIconMobile').innerText = '☀️';
        document.getElementById('themeIconPC').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIconMobile').innerText = '🌙';
        document.getElementById('themeIconPC').innerText = '🌙';
      }
    }

    function toggleFavoritesOnly() {
      state.favoritesOnly = !state.favoritesOnly;
      const btn = document.getElementById("favToggleBtn");
      const icon = document.getElementById("favToggleIcon");
      btn.setAttribute("aria-pressed", String(state.favoritesOnly));
      if (state.favoritesOnly) {
        btn.classList.add("bg-pink-600", "text-white", "border-pink-600", "hover:bg-pink-700");

      renderGrid();

            onclick="filterColor('${color.id}')"

          >
            ${color.name}
          </button>
        `;
      }).join('');
    }

            <!-- パーソナル情報（趣味・特技・資格） -->
            ${(member.hobby || member.skill || member.qualification) ? `
              <div class="mt-3 space-y-1.5 text-xs bg-slate-50/70 dark:bg-slate-800/40 rounded-2xl p-3 border border-slate-200/50 dark:border-slate-800">
                ${member.hobby ? `<p class="text-slate-700 dark:text-slate-300 leading-relaxed"><strong class="text-pink-600 dark:text-pink-400 font-bold mr-1">趣味:</strong>${member.hobby}</p>` : ''}
                ${member.skill ? `<p class="text-slate-700 dark:text-slate-300 leading-relaxed"><strong class="text-emerald-600 dark:text-emerald-400 font-bold mr-1">特技:</strong>${member.skill}</p>` : ''}
                ${member.qualification ? `<p class="text-slate-700 dark:text-slate-300 leading-relaxed"><strong class="text-amber-600 dark:text-amber-400 font-bold mr-1">資格:</strong>${member.qualification}</p>` : ''}
              </div>
            ` : ''}

            <!-- ファンネーム＆ハッシュタグ -->
            ${(member.fanName || tagsHtml) ? `
              <div class="mt-2.5 space-y-1">
                ${member.fanName ? `<p class="text-xs text-slate-600 dark:text-slate-400"><strong class="text-slate-800 dark:text-slate-200 mr-1">ファンネーム:</strong>${member.fanName}</p>` : ''}
                ${tagsHtml ? `<div class="flex flex-wrap gap-1 mt-1">${tagsHtml}</div>` : ''}
              </div>
            ` : ''}
          </div>

          <!-- 下部：カラー情報エリア（改行なし・文字小さめ最適化） -->
          <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800">
            <div class="grid grid-cols-2 gap-2">
              
              <!-- メンバーカラー -->
              <div class="flex flex-col items-center justify-center text-center p-2 rounded-2xl bg-white/90 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700">
                <span class="text-[9px] text-slate-500 dark:text-slate-400 font-black tracking-wider uppercase mb-0.5">MEMBER</span>
                <div class="h-10 flex items-center justify-center">${shapeSvg}</div>
                <span class="text-[11px] font-black text-slate-900 dark:text-white mt-1 block whitespace-nowrap truncate max-w-full">
                  ${member.mColorName}
                </span>
              </div>

              <!-- ペンライトカラー（イラスト下・改行無し小さめ） -->
              <div class="flex flex-col items-center justify-center text-center p-2 rounded-2xl bg-white/90 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700">
                <span class="text-[9px] text-slate-500 dark:text-slate-400 font-black tracking-wider uppercase mb-0.5">PENLIGHT</span>
                <div class="h-10 flex items-center justify-center">${penlightsHtml}</div>
                <span class="text-[10px] font-bold text-slate-700 dark:text-slate-200 mt-1 block whitespace-nowrap truncate max-w-full" title="${member.pColorName}">
                  ${member.pColorName}
                </span>
              </div>

            </div>
          </div>

        </article>
      `;
    }

    // グリッド描画エンジン
    function renderGrid() {
      const grid = document.getElementById("memberGrid");
      const pinnedGrid = document.getElementById("pinnedGrid");
      const pinnedSection = document.getElementById("pinnedSection");
      const noResults = document.getElementById("noResults");
      const resultCount = document.getElementById("resultCount");
      
      const filtered = members.filter(member => {
        if (state.group !== "all" && member.group !== state.group) return false;
        if (state.colorTag !== "all" && !member.tags.includes(state.colorTag)) return false;
        if (state.favoritesOnly && !state.favorites.includes(member.id)) return false;
        
        if (state.searchQuery) {
          const query = state.searchQuery.toLowerCase().trim();
          const searchableFields = [
            member.name, member.kana, member.nickname, member.role,
            member.mColorName, member.pColorName, member.fanName,
            member.birthplace, member.bloodType, member.zodiac, member.birthday,
            member.hobby, member.skill, member.qualification,
            ...(member.memberTags || [])
          ];
          const isMatch = searchableFields.some(field => field && field.toLowerCase().includes(query));
          if (!isMatch) return false;
        }
        return true;
      });

      resultCount.innerText = `${filtered.length}人`;

      if (filtered.length === 0) {
        grid.innerHTML = "";
        noResults.classList.remove("hidden");
        pinnedSection.classList.add("hidden");
        return;
      }

      noResults.classList.add("hidden");

      const favMembers = filtered.filter(m => state.favorites.includes(m.id));
      if (favMembers.length > 0 && !state.favoritesOnly) {
        pinnedSection.classList.remove("hidden");
        pinnedGrid.innerHTML = favMembers.map(m => createMemberCard(m, true)).join('');
      } else {
        pinnedSection.classList.add("hidden");
      }

      grid.innerHTML = filtered.map(m => createMemberCard(m, false)).join('');
    }

    function filterGroup(groupName) {
      state.group = groupName;
      ['all', 'equal-love', 'not-equal-me', 'nearly-equal-joy'].forEach(tabId => {
        const tab = document.getElementById(`tab-${tabId}`);
        const isSelected = tabId === groupName;
        tab.setAttribute('aria-selected', String(isSelected));
        if (isSelected) {
          if (tabId === 'all') tab.className = "min-h-[44px] py-2 px-1 text-xs sm:text-sm font-black rounded-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm";
          else if (tabId === 'equal-love') tab.className = "min-h-[44px] py-2 px-1 text-xs sm:text-sm font-black rounded-xl bg-pink-600 text-white shadow-sm";
          else if (tabId === 'not-equal-me') tab.className = "min-h-[44px] py-2 px-1 text-xs sm:text-sm font-black rounded-xl bg-emerald-600 text-white shadow-sm";
          else if (tabId === 'nearly-equal-joy') tab.className = "min-h-[44px] py-2 px-1 text-xs sm:text-sm font-black rounded-xl bg-yellow-300 text-slate-950 shadow-sm";
        } else {
          tab.className = "min-h-[44px] py-2 px-1 text-xs sm:text-sm font-black rounded-xl text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
        }
      });
      renderGrid();
    }

    function filterColor(colorId) {
      state.colorTag = colorId;
      renderColorFilters();
      renderGrid();
    }

    function clearSearch() {
      state.searchQuery = "";
      const input = document.getElementById("searchInput");
      input.value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderGrid();
      input.focus();
    }

    function resetFilters() {
      state.group = "all";
      state.colorTag = "all";
      state.searchQuery = "";
      state.favoritesOnly = false;
      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      
      const favBtn = document.getElementById("favToggleBtn");
      favBtn.setAttribute("aria-pressed", "false");
      favBtn.classList.remove("bg-pink-600", "text-white", "border-pink-600");
      favBtn.classList.add("bg-white", "dark:bg-slate-900", "text-slate-800", "dark:text-slate-200");
      document.getElementById("favToggleIcon").innerText = "☆";

      filterGroup("all");
      renderColorFilters();
      renderGrid();
    }

    let toastTimer = null;
    function showToast(message, icon = "💖") {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = message;
      document.getElementById("toastIcon").innerText = icon;
      toast.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
      }, 2200);
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      const clearBtn = document.getElementById("clearSearchBtn");
      if (state.searchQuery.length > 0) clearBtn.classList.remove("hidden");
      else clearBtn.classList.add("hidden");
      renderGrid();
    });

    function shareOnX() {
      const shareUrl = window.location.href;
      const shareText = "＝LOVE、≠ME、≒JOYのメンカラ・ペンライト・全プロフィールがすぐわかる早見表！✨";
      window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank', 'noopener,noreferrer');
    }

    function shareOnLine() {
      window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(window.location.href)}`, '_blank', 'noopener,noreferrer');
    }

    function copyPageUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast("ページのURLをコピーしました！", "🔗");
      }).catch(() => {});
    }

    window.onload = () => {
      loadTheme();
      renderColorFilters();
      renderGrid();
    };
  </script>
</body>
</html>
